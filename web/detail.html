<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detail menu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/app.css">
<style>
  body { background: var(--photo); }
  .top { height: 290px; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; font-weight: 600; background: var(--photo); overflow: hidden; }
  .top img { width: 100%; height: 100%; object-fit: cover; }
  .close { position: absolute; left: 16px; top: 16px; width: 44px; height: 44px; border-radius: 999px; background: #fff; display: flex; align-items: center; justify-content: center; z-index: 2; }
  .sheetx { position: relative; margin-top: -30px; background: var(--bg); border-radius: 32px 32px 0 0; padding: 26px 20px 140px; display: flex; flex-direction: column; gap: 20px; min-height: calc(100dvh - 260px); }
  .levels { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
  .levels button { height: 48px; border-radius: 14px; border: 1px solid var(--line); background: #fff; font-size: 16px; font-weight: 600; }
  .levels button[aria-pressed="true"] { background: var(--chili); color: #fff; border-color: var(--chili); font-weight: 700; }
  .extra { height: 52px; padding: 0 14px; border-radius: 16px; border: 1px solid var(--line); background: #fff; display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 600; width: 100%; }
  .extra .box { width: 22px; height: 22px; border-radius: 7px; border: 2px solid #C9C7BF; display: inline-flex; align-items: center; justify-content: center; margin-right: 12px; }
  .extra[aria-pressed="true"] .box { background: var(--ink); border-color: var(--ink); color: var(--lime); }
  .foot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; }
  .foot-in { max-width: 430px; margin: 0 auto; padding: 14px 16px 20px; background: var(--bg); border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
  .stepper { height: 56px; padding: 0 6px; border-radius: 999px; background: #fff; border: 1px solid var(--line); display: flex; align-items: center; gap: 4px; }
  .stepper button { width: 44px; height: 44px; border-radius: 999px; border: none; background: transparent; font-size: 20px; font-weight: 600; }
  .stepper span { min-width: 20px; text-align: center; font-size: 16px; font-weight: 700; }
</style>
</head>
<body>
<div class="phone" style="position:relative">
  <div class="top" id="top">[FOTO]</div>
  <a class="close" id="close" href="/" aria-label="Tutup"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
  <div class="sheetx" id="sheet" hidden>
    <div style="display:flex;flex-direction:column;gap:6px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px">
        <h1 id="nama" class="display" style="margin:0;font-size:28px;font-weight:800;letter-spacing:-.8px"></h1>
        <span id="harga" style="font-size:18px;font-weight:700;white-space:nowrap"></span>
      </div>
      <span id="desk" class="muted" style="font-size:14px;line-height:1.5"></span>
    </div>
    <div id="pedasBox" style="display:flex;flex-direction:column;gap:10px" hidden>
      <div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:15px;font-weight:700">Level pedas</span><span id="lvLbl" class="muted" style="font-size:13px"></span></div>
      <div class="levels" id="levels"></div>
    </div>
    <div id="extraBox" style="display:flex;flex-direction:column;gap:8px" hidden>
      <span style="font-size:15px;font-weight:700">Tambahan</span>
      <div id="extras" style="display:flex;flex-direction:column;gap:8px"></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <label for="catatan" style="font-size:15px;font-weight:700">Catatan untuk dapur</label>
      <textarea id="catatan" class="field" rows="2" maxlength="140" placeholder="Contoh: sambal dipisah" style="font-size:14px"></textarea>
    </div>
  </div>
  <div class="foot"><div class="foot-in">
    <div class="stepper"><button type="button" id="dec" aria-label="Kurangi jumlah">−</button><span id="qty">1</span><button type="button" id="inc" aria-label="Tambah jumlah">+</button></div>
    <button type="button" class="btn" id="add" style="flex:1;height:56px" disabled>Tambah</button>
  </div></div>
</div>
<script src="/js/common.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var NAMES = ['Tidak pedas', 'Sedikit pedas', 'Pedas', 'Pedas mantap', 'Sangat pedas', 'Pedas gila'];
  var item = null, st = { level: 3, qty: 1, extras: {} };
  var meja = DK.getMeja();
  $('close').href = '/' + (meja ? '?meja=' + encodeURIComponent(meja) : '');

  function money() {
    var ex = 0;
    item.extras.forEach(function (e) { if (st.extras[e.id]) ex += e.harga; });
    return (item.harga + ex) * st.qty;
  }
  function paint() {
    $('qty').textContent = st.qty;
    $('add').textContent = 'Tambah · ' + DK.rp(money());
    if (item.pedas) {
      $('lvLbl').textContent = 'Level ' + st.level + ' · ' + NAMES[st.level];
      $('levels').innerHTML = [0, 1, 2, 3, 4, 5].map(function (n) {
        return '<button type="button" data-l="' + n + '" aria-pressed="' + (n === st.level) + '" aria-label="Level ' + n + ', ' + NAMES[n] + '">' + n + '</button>';
      }).join('');
    }
    $('extras').innerHTML = item.extras.map(function (e) {
      var on = !!st.extras[e.id];
      return '<button type="button" class="extra" data-e="' + e.id + '" aria-pressed="' + on + '"><span style="display:flex;align-items:center"><span class="box">' + (on ? DK.icons.check.replace('width="16" height="16"', 'width="13" height="13"') : '') + '</span>' + DK.esc(e.nama) + '</span><span class="muted" style="font-weight:500">+' + DK.rp(e.harga) + '</span></button>';
    }).join('');
  }

  DK.api('/api/menu').then(function (m) {
    item = m.items.filter(function (x) { return x.id === +DK.q('id'); })[0];
    if (!item || !item.tersedia) { location.replace('/'); return; }
    document.title = item.nama;
    if (item.foto_url) $('top').innerHTML = '<img src="' + DK.esc(item.foto_url) + '" alt="">'; else $('top').textContent = '[FOTO ' + item.nama.toUpperCase() + ']';
    $('nama').textContent = item.nama;
    $('harga').textContent = DK.rp(item.harga);
    $('desk').textContent = item.deskripsi;
    $('pedasBox').hidden = !item.pedas;
    $('extraBox').hidden = item.extras.length === 0;
    $('sheet').hidden = false;
    $('add').disabled = false;
    paint();
  }).catch(function () { location.replace('/'); });

  $('levels').addEventListener('click', function (e) { var b = e.target.closest('[data-l]'); if (b) { st.level = +b.dataset.l; paint(); } });
  $('extras').addEventListener('click', function (e) { var b = e.target.closest('[data-e]'); if (b) { st.extras[b.dataset.e] = !st.extras[b.dataset.e]; paint(); } });
  $('inc').addEventListener('click', function () { st.qty = Math.min(50, st.qty + 1); paint(); });
  $('dec').addEventListener('click', function () { st.qty = Math.max(1, st.qty - 1); paint(); });
  $('add').addEventListener('click', function () {
    var ids = [], names = [], per = item.harga;
    item.extras.forEach(function (e) { if (st.extras[e.id]) { ids.push(e.id); names.push(e.nama); per += e.harga; } });
    DK.cart.add({ menu_id: item.id, nama: item.nama, harga: per, qty: st.qty, level: item.pedas ? st.level : null, extras: ids, extraNames: names, catatan: $('catatan').value.trim() });
    location.href = $('close').href;
  });
})();
</script>
</body>
</html>
